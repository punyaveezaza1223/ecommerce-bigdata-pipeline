networks:
  ecommerce-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ecommerce-br


services:

  # ==========================================================
  # 1. Airflow Metadata PostgreSQL
  # ==========================================================
  airflow-postgres:
    image: postgres:15
    container_name: pipeline-airflow-postgres
    networks:
      - ecommerce-network

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:?AIRFLOW_POSTGRES_PASSWORD is required}
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    restart: unless-stopped


  # ==========================================================
  # 2. Internal PostgreSQL
  # ==========================================================
  internal-postgres:
    image: postgres:15
    container_name: pipeline-internal-postgres
    networks:
      - ecommerce-network

    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ${INTERNAL_POSTGRES_PASSWORD:?INTERNAL_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ecommerce_internal

    ports:
      - "5451:5432"

    volumes:
      - internal_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_internal"]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped


  # ==========================================================
  # 3. Warehouse PostgreSQL
  # ==========================================================
  warehouse-postgres:
    image: postgres:15
    container_name: pipeline-warehouse-postgres
    networks:
      - ecommerce-network

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

    ports:
      - "5452:5432"

    volumes:
      - warehouse_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d ecommerce_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped



  # ==========================================================
  # 4. Spark Master
  # ==========================================================
  spark-master:
    image: spark:python3
    container_name: pipeline-spark-master
    hostname: spark-master

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    networks:
      - ecommerce-network

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    ports:
      - "7078:7077"
      - "8181:8080"

    volumes:
      - ./data:/opt/spark/data
      - ./spark:/opt/spark/jobs
      - ./data:/opt/airflow/data
      - ./spark:/opt/airflow/spark
      - ./jars/postgresql-42.7.3.jar:/opt/spark/jars/postgresql-42.7.3.jar

    restart: unless-stopped



  # ==========================================================
  # 5. Spark Worker
  # ==========================================================
  spark-worker:
    image: spark:python3
    container_name: pipeline-spark-worker
    hostname: spark-worker

    networks:
      - ecommerce-network

    depends_on:
      - spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - "1536M"
      - --webui-port
      - "8081"

    ports:
      - "8182:8081"

    volumes:
      - ./data:/opt/spark/data
      - ./spark:/opt/spark/jobs
      - ./data:/opt/airflow/data
      - ./spark:/opt/airflow/spark
      - ./jars/postgresql-42.7.3.jar:/opt/spark/jars/postgresql-42.7.3.jar

    restart: unless-stopped



  # ==========================================================
  # 6. Airflow Init
  # ==========================================================
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: ecommerce-airflow:2.10.5-spark4.2

    container_name: pipeline-airflow-init

    networks:
      - ecommerce-network


    depends_on:
      airflow-postgres:
        condition: service_healthy


    environment:

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:?AIRFLOW_POSTGRES_PASSWORD is required}@airflow-postgres:5432/airflow


      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"


    user: "${AIRFLOW_UID:-50000}:0"


    volumes:
      - ./dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./spark:/opt/airflow/spark
      - ./temp_shopee:/opt/airflow/temp_shopee
      - ./temp_lazada:/opt/airflow/temp_lazada


    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true
      "



  # ==========================================================
  # 7. Airflow Webserver
  # ==========================================================
  airflow-webserver:

    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: ecommerce-airflow:2.10.5-spark4.2

    container_name: pipeline-airflow-webserver


    networks:
      - ecommerce-network


    depends_on:

      airflow-postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully



    environment:

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:?AIRFLOW_POSTGRES_PASSWORD is required}@airflow-postgres:5432/airflow


      AIRFLOW__CORE__LOAD_EXAMPLES: "false"


    volumes:

      - ./dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./spark:/opt/airflow/spark


    ports:

      - "8190:8080"


    command:

      webserver


    healthcheck:

      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/health"
        ]

      interval: 10s
      timeout: 10s
      retries: 20


    restart: unless-stopped




  # ==========================================================
  # 8. Airflow Scheduler
  # ==========================================================
  airflow-scheduler:


    build:

      context: .

      dockerfile: Dockerfile.airflow


    image: ecommerce-airflow:2.10.5-spark4.2


    container_name: pipeline-airflow-scheduler


    hostname: airflow-scheduler


    networks:

      - ecommerce-network



    depends_on:


      airflow-postgres:

        condition: service_healthy


      airflow-init:

        condition: service_completed_successfully


      spark-master:

        condition: service_started



    environment:


      AIRFLOW__CORE__EXECUTOR: LocalExecutor


      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:?AIRFLOW_POSTGRES_PASSWORD is required}@airflow-postgres:5432/airflow


      AIRFLOW__CORE__LOAD_EXAMPLES: "false"


      AIRFLOW__SCHEDULER__HEARTBEAT_SEC: 10

      AIRFLOW__SCHEDULER__JOB_HEARTBEAT_SEC: 10


      SPARK_LOCAL_IP: 0.0.0.0

      # External API credentials and ingestion scope are injected at runtime.
      # Keep actual values outside version-controlled Compose configuration.
           # External API credentials and ingestion scope are injected at runtime.
      # Keep actual values outside version-controlled Compose configuration.

      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
      EBAY_SEARCH_QUERY: ${EBAY_SEARCH_QUERY:-}
      EBAY_SEARCH_QUERIES: ${EBAY_SEARCH_QUERIES:-}
      EBAY_MARKETPLACE_ID: ${EBAY_MARKETPLACE_ID:-}
      EBAY_PAGE_SIZE: ${EBAY_PAGE_SIZE:-100}

      MELI_ACCESS_TOKEN: ${MELI_ACCESS_TOKEN:-}
      MELI_CLIENT_ID: ${MELI_CLIENT_ID:-}
      MELI_CLIENT_SECRET: ${MELI_CLIENT_SECRET:-}
      MELI_REFRESH_TOKEN: ${MELI_REFRESH_TOKEN:-}
      MELI_SITE_ID: ${MELI_SITE_ID:-}
      MELI_SEARCH_QUERY: ${MELI_SEARCH_QUERY:-}
      MELI_PAGE_SIZE: ${MELI_PAGE_SIZE:-50}

      RAKUTEN_APPLICATION_ID: ${RAKUTEN_APPLICATION_ID:-}
      RAKUTEN_ACCESS_KEY: ${RAKUTEN_ACCESS_KEY:-}
      RAKUTEN_AFFILIATE_ID: ${RAKUTEN_AFFILIATE_ID:-}
      RAKUTEN_SEARCH_QUERY: ${RAKUTEN_SEARCH_QUERY:-}
      RAKUTEN_SEARCH_QUERIES: ${RAKUTEN_SEARCH_QUERIES:-}
      RAKUTEN_PAGE_SIZE: ${RAKUTEN_PAGE_SIZE:-30}

      EXTERNAL_MAX_PAGES: ${EXTERNAL_MAX_PAGES:-1}


    volumes:

      - ./dags:/opt/airflow/dags

      - ./ingestion:/opt/airflow/ingestion

      - ./logs:/opt/airflow/logs

      - ./plugins:/opt/airflow/plugins

      - ./data:/opt/airflow/data

      - ./spark:/opt/airflow/spark

      - /var/run/docker.sock:/var/run/docker.sock



    command:

      scheduler



    healthcheck:


      test:

        [
          "CMD",
          "airflow",
          "jobs",
          "check",
          "--job-type",
          "SchedulerJob"
        ]


      interval: 30s

      timeout: 10s

      retries: 5



    restart: unless-stopped




volumes:

  airflow_postgres_data:

  internal_postgres_data:

  warehouse_postgres_data:
